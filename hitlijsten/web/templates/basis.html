<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titel %}Hitlijsten{% endblock %}</title>
<style>
  :root {
    --rand: #d8dde3; --zacht: #f6f8fa; --tekst: #1f2933; --grijs: #5c6b7a;
    --accent: #1a5fb4; --goed: #d7f0d9; --fout: #fde2e1; --markering: #ddebf7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    color: var(--tekst); background: #fff;
  }
  header {
    background: var(--tekst); color: #fff; padding: .6rem 1.2rem;
    display: flex; align-items: center; gap: 1.4rem; flex-wrap: wrap;
  }
  header .merk { font-weight: 600; letter-spacing: .3px; }
  header nav { display: flex; gap: 1rem; flex-wrap: wrap; }
  header a { color: #cfd8e3; text-decoration: none; }
  header a:hover, header a.actief { color: #fff; }
  header .rechts { margin-left: auto; }
  main { padding: 1.4rem 1.6rem 3rem; max-width: 1500px; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  h2 { font-size: 1.05rem; margin: 1.8rem 0 .6rem; }
  a { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--rand); padding: .4rem .6rem; text-align: left; }
  th { background: var(--zacht); font-weight: 600; position: sticky; top: 0; }
  td.getal, th.getal { text-align: center; }
  tr:hover td { background: #fafbfc; }
  .kaarten { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .kaart {
    border: 1px solid var(--rand); border-radius: 8px; padding: .8rem 1.1rem;
    min-width: 150px; background: var(--zacht);
  }
  .kaart .cijfer { font-size: 1.5rem; font-weight: 600; }
  .kaart .naam { color: var(--grijs); font-size: .85rem; }
  form.inline { display: inline; }
  input[type=text], input[type=password], textarea, select {
    font: inherit; padding: .4rem .5rem; border: 1px solid var(--rand);
    border-radius: 5px; background: #fff;
  }
  input[type=text] { min-width: 18rem; }
  textarea { width: 100%; font-family: Consolas, monospace; font-size: 13px; }
  button {
    font: inherit; padding: .4rem .9rem; border: 1px solid var(--rand);
    border-radius: 5px; background: #fff; cursor: pointer;
  }
  button:hover { background: var(--zacht); }
  button.hoofd { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.gevaar { color: #a02c2c; }
  .melding { padding: .6rem .9rem; border-radius: 6px; margin-bottom: 1rem; }
  .melding.goed { background: var(--goed); }
  .melding.fout { background: var(--fout); }
  .hint { color: var(--grijs); font-size: .88rem; }
  code, .sleutel { font-family: Consolas, monospace; font-size: 12.5px; color: #3b4a5a; }
  #voortgang {
    background: #10161d; color: #cfe3ff; font-family: Consolas, monospace;
    font-size: 12.5px; padding: .8rem; border-radius: 6px; max-height: 22rem;
    overflow: auto; white-space: pre-wrap; display: none;
  }
</style>
</head>
<body>
<header>
  <span class="merk">Hitlijsten</span>
  <nav>
    <a href="{{ url_for('overzicht') }}">Overzicht</a>
    <a href="{{ url_for('zoek') }}">Zoeken</a>
    <a href="{{ url_for('aliassen') }}">Aliassen</a>
    <a href="{{ url_for('uitzonderingen') }}">Uitzonderingen</a>
    <a href="{{ url_for('query') }}">Query</a>
    <a href="{{ url_for('beheer') }}">Beheer</a>
    <a href="{{ url_for('wijzigingen') }}">Logboek</a>
  </nav>
  <span class="rechts"><a href="{{ url_for('afmelden') }}">Afmelden</a></span>
</header>
<main>
  {% with meldingen = get_flashed_messages(with_categories=true) %}
    {% for soort, tekst in meldingen %}
      <div class="melding {{ soort }}">{{ tekst }}</div>
    {% endfor %}
  {% endwith %}
  {% block inhoud %}{% endblock %}
</main>
</body>
</html>
