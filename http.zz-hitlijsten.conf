# Failover voor de hitlijsten-webapplicatie.
#
# De DSM-proxyregels (www.nl-hitlijsten.nl e.a.) wijzen naar 127.0.0.1:8640.
# Daar luistert dit doorgeefblok, dat het verkeer via de upstream-groep naar
# de applicatie stuurt -- en bij een storing of timeout naar de permanente
# onderhoudspagina. De bezoeker ziet dan onze eigen pagina in plaats van de
# grijze Synology-fout.
#
# Waarom dit tussenblok bestaat: DSM schrijft zijn serverblokken bij elke
# wijziging opnieuw uit ReverseProxy.json, dus daar valt geen failover in te
# zetten. En rechtstreeks een upstream-groep aan de DSM-regel hangen kan ook
# niet: nginx weigert een proxy_pass met poortnummer zodra de hostnaam een
# upstream-groep blijkt te zijn ("may not have port"), en de DSM-UI kan de
# poort niet weglaten. Vandaar: DSM -> 8640 (gewoon adres) -> upstream.
#
#   8642  de webapplicatie (hitlijsten-web)
#   8641  de onderhoudspagina, permanent aan (hitlijsten-standby)
#   8640  dit doorgeefblok
#
# De timeouts hier bepalen wanneer er wordt uitgeweken en staan daarom
# BEWUST LAGER dan die van de DSM-regel (120 s): valt de applicatie stil,
# dan wijkt dit blok uit vóórdat DSM zelf opgeeft. Andersom zou de bezoeker
# alsnog de Synology-pagina zien.
#
# Zelfherstellend: hitlijsten-standby.service zet dit bestand bij het
# opstarten terug als een DSM-upgrade het heeft gewist (herstel-nginx.sh).

upstream hitlijsten-backend {
    server 127.0.0.1:8642 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8641 backup;
}

server {
    listen 127.0.0.1:8640;

    # Alles doorgeven zoals het binnenkwam; DSM's blok heeft de echte
    # bezoekerskoppen (Host, X-Forwarded-For) al gezet en die reizen mee.
    location / {
        proxy_pass http://hitlijsten-backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Verbinden op loopback hoort onmiddellijk te lukken; lukt het niet,
        # dan is de applicatie weg en is snel uitwijken beter dan wachten.
        proxy_connect_timeout 5s;
        # Ruim genoeg voor de traagste echte pagina, krap genoeg om vóór de
        # DSM-timeout (120 s) uit te wijken.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # Uitwijken bij verbindingsfouten en timeouts. Alleen voor GET/HEAD
        # (niet-idempotente verzoeken herhaalt nginx bewust niet).
        proxy_next_upstream error timeout;
    }
}
